<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<!-- seo:start -->
		<!-- Everything between these markers is replaced per route by
		     scripts/seo-build.mjs. The values below are the homepage defaults and
		     the dev-server fallback. Source of truth: src/seo/routes.ts. -->
		<title data-seo>Locker Room Talks | Documentary Conversations on Migration &amp; Belonging</title>
		<meta
			name="description"
			content="Locker Room Talks is a documentary video-podcast and journal exploring migration, belonging, identity and life in Finland through long-form conversations."
			data-seo
		/>
		<meta name="author" content="Locker Room Talks" data-seo />
		<link rel="canonical" href="https://www.lockerroomtalks.net/" data-seo />
		<!-- seo:end -->

		<meta name="twitter:site" content="@LockerRoomTalk" />

		<!-- Favicons / app icons -->
		<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
		<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
		<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
		<link rel="icon" type="image/png" sizes="512x512" href="/favicon-512x512.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/site.webmanifest" />
		<meta name="theme-color" content="#F6F5F2" />


		<!-- Typography: serif display for tagline "Conversations." -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="preconnect" href="https://fonts.cdnfonts.com" crossorigin />
		<link
			rel="preload"
			href="/fonts/ff-market-web.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400;1,500&display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital,wght@0;400;1;400&display=swap"
			rel="stylesheet"
		/>
		<link href="https://fonts.cdnfonts.com/css/gilroy-bold" rel="stylesheet" />
	</head>

	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
